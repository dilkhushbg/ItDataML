<style>
  :root{
    --bg:#101512; --panel:#171E1A; --ink:#ECEFEA; --ink-soft:#A6B2AA; --line:#2A332D; --teal:#4FB99D; --gold:#E0B24F;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding: 32px;
  }
  .wrap{ max-width: 440px; }
  .brand{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.4rem; }
  .brand .dot{ color:var(--teal); }
  .tagline{ font-size:0.8rem; color:var(--ink-soft); margin-top:4px; margin-bottom:40px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.7rem,5vw,2.3rem); letter-spacing:-0.01em; margin-bottom:16px; }
  h1 span{ color:var(--teal); }
  p{ color:var(--ink-soft); font-size:1rem; line-height:1.6; max-width:34ch; margin:0 auto; }
  .cta-row{ margin-top:32px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{ display:inline-block; padding:12px 22px; border-radius:3px; font-weight:600; font-size:0.9rem; text-decoration:none; border:1px solid var(--ink); color:var(--ink); }
  .btn.primary{ background:var(--teal); border-color:var(--teal); color:#0d140f; }
  .social-row{ display:flex; gap:18px; justify-content:center; margin-top:44px; }
  .social-row a{ color:var(--ink-soft); display:flex; }
  .social-row a:hover{ color:var(--teal); }
  .social-row svg{ width:18px; height:18px; }
</style>
</head>
