<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It DataML — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101512; --panel:#171E1A; --ink:#ECEFEA; --ink-soft:#A6B2AA; --line:#2A332D; --teal:#4FB99D; --gold:#E0B24F;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding: 32px;
  }
  .wrap{ max-width: 420px; }
  .code{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(4rem,14vw,6rem); line-height:1; letter-spacing:-0.02em; }
  .code .ml{ color:var(--teal); }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.3rem; margin:18px 0 12px; }
  p{ color:var(--ink-soft); font-size:0.96rem; line-height:1.6; max-width:34ch; margin:0 auto; }
  .cta-row{ margin-top:30px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{ display:inline-block; padding:12px 22px; border-radius:3px; font-weight:600; font-size:0.9rem; text-decoration:none; border:1px solid var(--ink); color:var(--ink); }
  .btn.primary{ background:var(--teal); border-color:var(--teal); color:#0d140f; }
  .brand{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.9rem; margin-top:48px; color:var(--ink-soft); }
  .brand .dot{ color:var(--teal); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">4<span class="ml">0</span>4</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist, or it's moved somewhere else.</p>

    <div class="cta-row">
      <a href="/" class="btn primary">Back to home</a>
      <a href="mailto:itdataml.agency@gmail.com" class="btn">Contact us</a>
    </div>

    <div class="brand">It Data<span class="dot">ML</span></div>
  </div>
</body>
</html>
